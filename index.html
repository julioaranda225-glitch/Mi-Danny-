<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mi Danny, con amor</title>

    <style>
        :root {
            --primary-yellow: #FFD700;
            --soft-blue: #A2C2E8;
            --pure-white: #FFFFFF;
            --text-dark: #2C3E50;
            --bg-gradient: linear-gradient(135deg, #fdfbf7 0%, #e1eec3 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--text-dark);
        }

        /* --- PANTALLA DE BIENVENIDA (GIRASOLES) --- */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #fff 20%, #f6e58d 100%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease-in-out;
            opacity: 1;
            visibility: visible;
        }

        .sunflower-garden {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .bg-sunflower {
            position: absolute;
            font-size: 5rem;
            animation: floatSunflower 6s ease-in-out infinite alternate;
            opacity: 0.8;
        }

        @keyframes floatSunflower {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-20px) rotate(15deg); }
        }

        .welcome-box {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 3px solid var(--primary-yellow);
            z-index: 10;
            max-width: 90%;
            animation: pulseBox 2s infinite alternate;
        }

        @keyframes pulseBox {
            0% { transform: scale(0.98); }
            100% { transform: scale(1.02); }
        }

        .welcome-box h1 {
            font-family: 'Playfair Display', serif;
            color: var(--text-dark);
            margin-bottom: 1rem;
            font-size: 2.5rem;
        }

        .welcome-box p {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 1rem;
        }

            background: var(--primary-yellow);
            color: var(--text-dark);
            border: none;

            font-size: 1.2rem;
