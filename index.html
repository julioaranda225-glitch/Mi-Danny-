<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para Mi Danny 🌻</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>

:root{
  --gold:#ffd166;
}

body{
  margin:0;
  background:#0f0f14;
  overflow:hidden;
  font-family:'Inter', sans-serif;
  color:#fff;
}

/* 🎬 INTRO */
#intro{
  position:fixed;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#0f0f14;
  z-index:999;
}

#intro h1{
  font-weight:300;
  letter-spacing:2px;
  opacity:0;
  animation:fadeIn 2s forwards;
}

/* 🌅 LUZ */
.luz{
  position:fixed;
  width:600px;
  height:600px;
  background:radial-gradient(circle, rgba(255,209,102,0.25), transparent);
  top:-200px;
  left:-200px;
  animation:luzMove 10s infinite alternate;
}

/* 🌻 RAMO */
.ramo{
  position:fixed;
  top:60px;
  left:50%;
  transform:translateX(-50%) scale(0.8);
  width:240px;
  opacity:0;
  filter:blur(20px);
  animation:ramoIn 2s ease 2s forwards;
}

/* 💌 CARTA */
.carta{
  position:relative;
  max-width:700px;
  margin:200px auto;
  padding:40px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(10px);
  border-radius:20px;
  box-shadow:0 10px 40px rgba(0,0,0,0.5);
  opacity:0;
  transform:translateY(50px);
  animation:entrada 2s ease 3s forwards;
}

/* TEXTO */
h2{
  font-family:'Dancing Script';
  font-size:44px;
  color:var(--gold);
}

p{
  opacity:0;
  margin:10px 0;
}

/* 🌸 PETALOS */
.petalo{
  position:fixed;
  top:-50px;
  width:18px;
  opacity:0.85;
  pointer-events:none;
  animation:fall linear forwards;
}

/* ANIMACIONES */

@keyframes fadeIn{
  to{opacity:1;}
}

@keyframes luzMove{
  to{transform:translate(300px,300px);}
}

@keyframes ramoIn{
  to{
    opacity:1;
    filter:blur(0);
    transform:translateX(-50%) scale(1);
  }
}

@keyframes entrada{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes fall{
  0%{transform:translate(0,-50px) rotate(0);}
  50%{transform:translate(80px,50vh) rotate(180deg);}
  100%{transform:translate(-120px,110vh) rotate(360deg);}
}

</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
  <h1>Hay cosas que nunca se olvidan…</h1>
</div>

<!-- LUZ -->
<div class="luz"></div>

<!-- RAMO -->
<img class="ramo" src="https://i.ibb.co/6y7nZQx/ramo-girasoles.png">

<!-- CARTA -->
<div class="carta">
  <h2>Mi Danny</h2>

  <p>Amor de Mi Vida y para Mi Vida..</p>
  <p>A veces me pongo a pensar…</p>
  <p>y no sé qué es más difícil…</p>
  <p>olvidarte… o aceptar que no quiero hacerlo.</p>
  <p>Porque si volviera atrás…</p>
  <p>te elegiría otra vez.</p>
  <p>Sin dudarlo.</p>
</div>

<script>

/* 🎬 INTRO */
setTimeout(()=>{
  document.getElementById("intro").style.display="none";
  escribir();
},2500);

/* ✍️ TEXTO PROGRESIVO */
function escribir(){
  let p=document.querySelectorAll(".carta p");
  p.forEach((el,i)=>{
    setTimeout(()=>{
      el.style.opacity=1;
    },i*700);
  });
}

/* 🌸 PETALOS PRO */
function petalo(){
  let p=document.createElement("img");
  p.src="https://i.ibb.co/7QpKsCX/petalo.png";
  p.classList.add("petalo");

  p.style.left=Math.random()*100+"vw";
  p.style.animationDuration=(5+Math.random()*5)+"s";
  p.style.transform="rotate("+Math.random()*360+"deg+")";

  document.body.appendChild(p);

  setTimeout(()=>p.remove(),10000);
}

setInterval(petalo,180);

</script>

</body>
</html>
