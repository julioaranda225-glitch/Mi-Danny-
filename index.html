<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mi Danny, con amor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        :root {
            --primary-yellow: #FFD700;
            --soft-blue: #A2C2E8;
            --pure-white: #FFFFFF;
            --text-dark: #2C3E50;
            --bg-gradient: linear-gradient(135deg, #fbf9f5 0%, #f3eada 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--text-dark);
            position: relative;
        }

        /* FONDOS Y LUCES AMBIENTALES */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 10% 20%, rgba(255, 233, 161, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 90% 80%, rgba(162, 194, 232, 0.15) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
        }

        /* --- 1. PANTALLA DE BIENVENIDA --- */
        #welcome-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #ffffff 10%, #fdf5e6 100%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

            position: absolute;
            width: 100%; height: 100%;
            pointer-events: none;
        }
