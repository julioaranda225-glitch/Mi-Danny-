<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mi Danny, con amor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-yellow: #FFD700;
            --soft-blue: #A2C2E8;
            --pure-white: #FFFFFF;
            --text-dark: #2C3E50;
            --bg-gradient: linear-gradient(135deg, #fbf9f5 0%, #f3eada 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--text-dark);
            position: relative;
        }

        /* FONDOS Y LUCES AMBIENTALES */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 10% 20%, rgba(255, 233, 161, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 90% 80%, rgba(162, 194, 232, 0.15) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
        }

        /* --- 1. PANTALLA DE BIENVENIDA --- */
        #welcome-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #ffffff 10%, #fdf5e6 100%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sunflower-garden {
            position: absolute;
            width: 100%; height: 100%;
            pointer-events: none;
        }

        .bg-sunflower {
            position: absolute;
            font-size: 5rem;
            animation: floatSunflower 6s ease-in-out infinite alternate;
            opacity: 0.85;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.08));
        }

        @keyframes floatSunflower {
            0% { transform: translateY(0) rotate(0deg) scale(1); }
            100% { transform: translateY(-25px) rotate(12deg) scale(1.05); }
        }

        .welcome-box {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 3.5rem;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(220, 180, 50, 0.15);
            border: 2px solid rgba(255, 215, 0, 0.5);
            z-index: 10;
            max-width: 500px;
            width: 90%;
            animation: pulseBox 3s infinite ease-in-out;
        }

        @keyframes pulseBox {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        .welcome-box h1 {
            font-family: 'Playfair Display', serif;
            color: #333;
            margin-bottom: 1.5rem;
            font-size: 2.3rem;
            letter-spacing: 1px;
        }

        .welcome-box p {
            font-size: 1rem;
            color: #666;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        .enter-btn {
            background: linear-gradient(135deg, #ffd700 0%, #fbc531 100%);
            color: #222;
            border: none;
            padding: 16px 45px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.35);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .enter-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 30px rgba(255, 215, 0, 0.5);
        }

        /* --- 2. CONTENEDOR PRINCIPAL DE LA CARTA --- */
        .main-container {
            max-width: 850px;
            margin: 5rem auto;
            padding: 0 25px;
            display: none;
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1), transform 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 5;
        }

        .main-container.visible {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* PERGAMINO PREMIUM HECHO A MANO */
        .letter-paper {
            background: #fffcf6;
            background-image: radial-gradient(rgba(235,220,190,0.4) 1px, transparent 0);
            background-size: 24px 24px;
            padding: 7rem 5rem 5rem 5rem;
            border-radius: 8px;
            position: relative;
            /* Efecto texturizado y bordes quemados realistas */
            box-shadow: 
                0 25px 70px rgba(0,0,0,0.07),
                inset 0 0 60px rgba(230, 210, 180, 0.4),
                inset -5px -5px 15px rgba(210,185,145,0.2),
                inset 5px 5px 15px rgba(255,255,255,0.9);
            border: 1px solid rgba(220,200,170,0.4);
        }

        /* Ramo de Girasoles en la Cabecera Superior */
        .top-bouquet {
            position: absolute;
            top: -45px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 5rem;
            white-space: nowrap;
            filter: drop-shadow(0 12px 10px rgba(0,0,0,0.1));
            user-select: none;
            z-index: 10;
        }

        /* Detalles sutiles dibujados en las esquinas */
        .corner-branch {
            position: absolute;
            font-size: 2.2rem;
            opacity: 0.25;
            user-select: none;
            font-family: serif;
        }
        .cb-tl { top: 30px; left: 40px; transform: scaleX(-1) rotate(25deg); }
        .cb-tr { top: 30px; right: 40px; transform: rotate(25deg); }
        .cb-bl { bottom: 40px; left: 40px; transform: scale(-1); }
        .cb-br { bottom: 40px; right: 40px; }

        /* TEXTO QUE SIMULA ESCRITURA CON PLUMA */
        .letter-content {
            font-family: 'Alex Brush', cursive;
            font-size: 2.6rem;
            line-height: 1.5;
            color: #253342;
            text-align: justify;
            word-spacing: 2px;
        }

        .letter-content p {
            margin-bottom: 2.2rem;
            text-indent: 3rem;
        }

        .letter-content .headline {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 2.8rem;
            text-align: left;
            margin-bottom: 3.5rem;
            text-indent: 0;
            color: #1a252f;
            font-weight: 400;
            padding-bottom: 15px;
            border-bottom: 1px dashed rgba(162, 194, 232, 0.6);
        }

        .signature {
            margin-top: 5rem;
            text-align: right;
            font-size: 2.8rem;
            line-height: 1.4;
            text-indent: 0 !important;
            padding-right: 1rem;
        }

        .signature strong {
            font-family: 'Alex Brush', cursive;
            font-weight: 700;
            font-size: 3rem;
            color: #111;
        }

        .heart-icon {
            color: var(--soft-blue);
            font-size: 1.8rem;
            display: inline-block;
            animation: heartbeat 1.6s infinite ease-in-out;
            margin-left: 5px;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.25); }
        }

        /* --- 3. CONTENEDOR DEL VIDEO --- */
        .video-section {
            margin-top: 4rem;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.04);
            border: 1px solid rgba(255,255,255,0.7);
            text-align: center;
        }

        .video-section h3 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 400;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-size: 0.85rem;
            margin-bottom: 2rem;
            color: #8fa0b0;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.12);
            background: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: none;
        }

        /* --- EFECTO INTERACTIVO DE PÉTALOS VOLADORES --- */
        .petal {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            font-size: 1.6rem;
            user-select: none;
            animation: fadeOutPetal 1.2s forwards ease-out;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05));
        }

        @keyframes fadeOutPetal {
            0% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1.2); }
            100% { opacity: 0; transform: translate(var(--mx), var(--my)) rotate(var(--rt)) scale(0.4); }
        }

        /* DISEÑO RESPONSIVO (MÓVILES) */
        @media (max-width: 768px) {
            .letter-paper { padding: 6rem 2.2rem 4rem 2.2rem; }
            .letter-content { font-size: 2.1rem; line-height: 1.4; }
            .letter-content p { text-indent: 1.5rem; margin-bottom: 1.8rem; }
            .main-container { margin: 2rem auto; }
            .top-bouquet { font-size: 3.8rem; top: -30px; }
            .
