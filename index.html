<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Escena Romántica</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
        height: 100vh;
        font-family: 'Georgia', serif;
    }

    /* Texto tipo carta */
    .mensaje {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 28px;
        text-align: center;
        max-width: 600px;
        line-height: 1.5;
        text-shadow: 0 0 10px rgba(255,255,255,0.5);
        z-index: 10;
    }

    /* Contenedor de pétalos */
    .petalos {
        position: fixed;
        width: 100%;
        height: 100%;
        pointer-events: none;
        top: 0;
        left: 0;
    }

    .petalo {
        position: absolute;
        width: 40px;
        height: 40px;
        background-image: url('petalo.png');
        background-size: contain;
        background-repeat: no-repeat;
        opacity: 0.8;
        animation: caer linear infinite;
    }

    /* Animación */
    @keyframes caer {
        0% {
            transform: translateY(-10vh) rotate(0deg);
            opacity: 0;
        }
        10% {
            opacity: 1;
        }
        100% {
            transform: translateY(110vh) rotate(360deg);
            opacity: 0;
        }
    }
</style>
</head>

<body>

<div class="mensaje">
    A veces me pongo a pensar…<br>
    y no sé qué es más doloroso.<br><br>

    Si haber vivido algo tan real contigo…<br>
    y ahora extrañarlo,<br><br>

    o nunca haberlo vivido.<br><br>

    Pero si soy honesto,<br>
    te volvería a elegir… siempre.
</div>

<div class="petalos" id="petalos"></div>

<script>
    const contenedor = document.getElementById("petalos");

    function crearPetalo() {
        const petalo = document.createElement("div");
        petalo.classList.add("petalo");

        petalo.style.left = Math.random() * 100 + "vw";
        petalo.style.animationDuration = (5 + Math.random() * 5) + "s";
        petalo.style.width = (20 + Math.random() * 30) + "px";
        petalo.style.height = petalo.style.width;

        contenedor.appendChild(petalo);

        setTimeout(() => {
            petalo.remove();
        }, 10000);
    }

    setInterval(crearPetalo, 300);
</script>

</body>
</html>
