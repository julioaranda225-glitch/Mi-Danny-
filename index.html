<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mi Danny, con amor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-yellow: #FFD700;
            --soft-blue: #A2C2E8;
            --pure-white: #FFFFFF;
            --text-dark: #2C3E50;
            --bg-gradient: linear-gradient(135deg, #fdfbf7 0%, #e1eec3 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--text-dark);
        }

        /* --- PANTALLA DE BIENVENIDA (GIRASOLES) --- */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #fff 20%, #f6e58d 100%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease-in-out;
            opacity: 1;
            visibility: visible;
        }

        .sunflower-garden {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Girasoles estáticos de fondo en la bienvenida */
        .bg-sunflower {
            position: absolute;
            font-size: 5rem;
            animation: floatSunflower 6s ease-in-out infinite alternate;
            opacity: 0.8;
        }

        @keyframes floatSunflower {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-20px) rotate(15deg); }
        }

        .welcome-box {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 3px solid var(--primary-yellow);
            z-index: 10;
            max-width: 90%;
            animation: pulseBox 2s infinite alternate;
        }

        @keyframes pulseBox {
            0% { transform: scale(0.98); }
            100% { transform: scale(1.02); }
        }

        .welcome-box h1 {
            font-family: 'Playfair Display', serif;
            color: var(--text-dark);
            margin-bottom: 1rem;
            font-size: 2.5rem;
        }

        .welcome-box p {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 2rem;
        }

        .enter-btn {
            background: var(--primary-yellow);
            color: var(--text-dark);
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
            transition: all 0.3s ease;
            position: relative;
            z-index: 20;
        }

        .enter-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.6);
            background: #ecc100;
        }

        /* --- CONTENEDOR PRINCIPAL DE LA CARTA --- */
        .main-container {
            max-width: 800px;
            margin: 4rem auto;
            padding: 0 20px;
            display: none;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1s ease-out, transform 1s ease-out;
        }

        .main-container.visible {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* El pergamino/hoja simulada hecha a mano */
        .letter-paper {
            background: var(--pure-white);
            background-image: radial-gradient(#f3eedf 10%, transparent 11%), radial-gradient(#f3eedf 10%, transparent 11%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            padding: 5rem 4rem;
            border-radius: 4px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08), inset 0 0 40px rgba(243, 238, 223, 0.5);
            position: relative;
            border-left: 2px solid rgba(162, 194, 232, 0.3);
        }

        /* Decoración de Girasoles en las esquinas */
        .corner-decoration {
            position: absolute;
            font-size: 3.5rem;
            opacity: 0.9;
            user-select: none;
        }
        .top-left { top: 15px; left: 15px; transform: rotate(-15deg); }
        .top-right { top: 15px; right: 15px; transform: rotate(15deg); }
        .bottom-left { bottom: 15px; left: 15px; transform: rotate(-45deg); }
        .bottom-right { bottom: 15px; right: 15px; transform: rotate(45deg); }

        /* Estilos del texto escrito a mano */
        .letter-content {
            font-family: 'Caveat', cursive;
            font-size: 1.85
